<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purple Flowers</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Constantia, "Lucida Bright", Georgia, serif;
            background-color: #F6D0FF;
            color: white;
        }

        img {
            max-width: 100%;
            height: auto;
        }


        header {
            width: 100%;
            min-height: 300px;

            background-image: linear-gradient(
                rgba(50, 0, 70, 0.35),
                rgba(50, 0, 70, 0.35)
            ),
            url("Purple_flower_banner.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 20px;

            position: relative;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 50px;
            font-family: "Dancing Script", cursive;

            position: relative;
            z-index: 2;
        }

        header p {
            margin: 0;
            font-size: 18px;
            line-height: 1.5;

            position: relative;
            z-index: 2;
        }


        .butterfly {
            position: absolute;

            width: 100px;
            height: auto;

            top: 25%;
            left: 5%;

            z-index: 1;

            pointer-events: none;

            animation-name: butterflyFly;
            animation-duration: 12s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }


        @keyframes butterflyFly {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(60px, -20px);
            }

            50% {
                transform: translate(120px, 15px);
            }

            75% {
                transform: translate(180px, -15px);
            }

            100% {
                transform: translate(240px, 0);
            }

        }


        .photo-grid {

            width: 90%;
            max-width: 768px;

            margin: 30px auto 40px;

            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            grid-template-rows: auto auto auto auto;

            gap: 2px;
        }

        .photo-grid img {
            width: 100%;
            max-width: 100%;
            display: block;
        }

        .photo1 {
            grid-column: 1;
            grid-row: 1;
        }

        .photo2 {
            grid-column: 1;
            grid-row: 2;
        }

        .photo3 {
            grid-column: 1;
            grid-row: 3;
        }

        .photo4 {
            grid-column: 2;
            grid-row: 1 / 4;

            height: 100%;
            object-fit: cover;
        }

        .photo5 {
            grid-column: 1 / 3;
            grid-row: 4;

            width: 100%;
        }


        footer {
            text-align: center;
            padding: 25px;
            background-color: #D183E2;
            color: white;
        }

        footer p {
            margin: 0;
            font-size: 16px;
        }


        @media screen and (max-width: 750px) {

            header {
                min-height: 220px;
                padding: 25px 15px;
            }

            h1 {
                font-size: 42px;
            }

            header p {
                font-size: 20px;
                line-height: 1.8;
            }


            .butterfly {
                width: 80px;
                top: 15%;
                left: 5%;

                animation-name: butterflyFlyMobile;
            }


            /* Mobile butterfly movement */

            @keyframes butterflyFlyMobile {

                0% {
                    transform: translate(0, 0);
                }

                25% {
                    transform: translate(20px, -10px);
                }

                50% {
                    transform: translate(40px, 10px);
                }

                75% {
                    transform: translate(60px, -10px);
                }

                100% {
                    transform: translate(80px, 0);
                }

            }


            .photo-grid {

                width: 95%;
                max-width: 100%;

                margin: 20px auto 30px;

                grid-template-columns: 1fr;

                grid-template-rows: auto;

                gap: 10px;
            }

            .photo-grid img {

                width: 100%;
                max-width: 100%;

                height: auto;
                object-fit: cover;

                grid-column: 1;
                grid-row: auto;
            }


            footer {
                padding: 25px 15px;
            }

            footer p {
                font-size: 18px;
                line-height: 1.8;
            }

        }


        @media (prefers-reduced-motion: reduce) {

            .butterfly {
                animation: none;
            }

        }

    </style>

</head>


<body>

    <header>


        <img
            src="Butterfly.png"
            alt=""
            class="butterfly"
        >

        <h1>Purple Flowers</h1>

        <p>
            ✿ A collection of purple flowers from around the world. ✿
        </p>

    </header>


    <main>

        <div class="photo-grid">

            <img
                class="photo1"
                src="Lavender_flower.jpg"
                alt="Purple flowers in a field"
            >

            <img
                class="photo2"
                src="Purple_cranesbill.jpg"
                alt="Purple flowers growing in a garden"
            >

            <img
                class="photo3"
                src="Purple_daisy.jpg"
                alt="Purple flowers in a field"
            >

            <img
                class="photo4"
                src="Dewdrop_flowers.jpg"
                alt="Close-up of a purple flower"
            >

            <img
                class="photo5"
                src="Purple_flowerfield.jpg"
                alt="Purple flowers close up"
            >

        </div>

    </main>


    <footer>

        <p>Purple Flowers Photography Provided by Pixabay</p>

    </footer>

</body>

</html>
