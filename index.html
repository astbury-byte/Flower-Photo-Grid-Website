<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purple Flowers</title>


    <style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
 

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Constantia, "Lucida Bright", "DejaVu Serif", Georgia, "serif"sans-serif;
            background-color: #F6D0FF;
            color: white;
        }



        header {
     width: 100%;
    height: 300px;

    background-image: linear-gradient(
        rgba(50, 0, 70, 0.35),
        rgba(50, 0, 70, 0.35)
    ),
    url("Purple_flower_banner.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
}

h1 {
    margin: 0 0 10px;
    font-size: 50px;
    font-family: "Dancing Script", cursive;
}

header p {
    margin: 0;
    font-size: 18px;
}

        header p {
            margin: 0;
            font-size: 18px;
        }


        .photo-grid {

            width: 768px;

            margin: 30px auto 40px;

            display: grid;

      
            grid-template-columns: 384px 384px;

         
            grid-template-rows: auto auto auto auto;

       
            gap: 2px;

        }



        .photo-grid img {

            width: 384px;

            height: auto;

            display: block;

        }


        .photo1 {

            grid-column: 1;

            grid-row: 1;

        }


        .photo2 {

            grid-column: 1;

            grid-row: 2;

        }



        .photo3 {

            grid-column: 1;

            grid-row: 3;

        }


        .photo4 {

            grid-column: 2;

            grid-row: 1 / 4;
			height: 100% !important;
			object-fit: cover;

        }


  

        .photo5 {

            grid-column: 1 / 3;

            grid-row: 4;

            width: 768px !important;

        }



        footer {

            text-align: center;

            padding: 25px;

            background-color: #D183E2;

            color: white;

        }

    </style>

</head>


<body>




    <header>

        <h1>Purple Flowers</h1>

        <p>
            ✿ A collection of purple flowers from around the world. ✿
        </p>

    </header>



    <main>

        <div class="photo-grid">

         <img
                class="photo1"
                src="Lavender_flower.jpg"
                alt="Purple flowers in a field"
            >



            <img
                class="photo2"
                src="Purple_cranesbill.jpg"
                alt="Purple flowers growing in a garden"
            >


            <img
                class="photo3"
                src="Purple_daisy.jpg"
                alt="Purple flowers in a field"
            >



            <img
                class="photo4"
                src="Dewdrop_flowers.jpg"
                alt="Close-up of a purple flower"
            >


            <img
                class="photo5"
                src="Purple_flowerfield.jpg"
                alt="Purple flowers close up"
            >


        </div>

    </main>


    <footer>

        <p>Purple Flowers Photography Provided by Pixabay</p>

    </footer>


</body>

</html>
